<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stallz Loans - Secure Access</title>
  <meta name="theme-color" content="#0f172a">

  <link rel="icon" type="image/png" href="assets/logo_images/myfavicon.png">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #3b82f6;
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --accent-glow: #60a5fa;

      /* Brighter Background Colors */
      --bg-deep: #0f172a;
      --bg-light: #1e293b;

      /* Brighter Glass Effect */
      --glass-surface: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-highlight: rgba(255, 255, 255, 0.1);

      --text-main: #ffffff;
      --text-muted: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-deep);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-light), var(--bg-deep));
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      padding: 20px 16px;
    }

    /* --- ANIMATED AURORA BACKGROUND --- */
    .aurora-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.65;
      animation: float 20s infinite ease-in-out;
      mix-blend-mode: screen;
    }
    .blob-1 {
      top: -10%; left: -10%; width: 60vw; height: 60vw;
      background: #2563eb;
      animation-delay: 0s;
    }
    .blob-2 {
      bottom: -10%; right: -10%; width: 70vw; height: 70vw;
      background: #059669;
      animation-delay: -5s;
    }
    .blob-3 {
      top: 40%; left: 40%; width: 50vw; height: 50vw;
      background: #7c3aed;
      opacity: 0.5;
      animation-delay: -10s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* --- GLASS CARD CONTAINER --- */
    .login-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      margin: auto;
    }

    .glass-card {
      width: 100%;
      padding: 32px 24px;
      border-radius: 24px;
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1px var(--glass-highlight);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, height 0.3s ease;
    }

    /* Noise Texture Overlay */
    .glass-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    /* --- HEADER SECTION --- */
    .brand-section {
      text-align: center;
      position: relative;
      z-index: 1;
      margin-bottom: 25px;
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 10px;
    }

    /* UPDATED LOGO STYLES (NO GLASS) */
    .logo-img {
      height: 130px;
      width: 130px;
      object-fit: contain;
      border-radius: 50%;
      /* Removed glass background and border */
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
      /* Added drop shadow for lift */
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
    }

    .welcome-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .tagline {
      font-size: 0.75rem;
      font-weight: 700;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .sub-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* --- RATES WIDGET --- */
    .rates-widget {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .rates-label {
      font-size: 0.65rem;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rates-label i { color: #3b82f6; }

    .rates-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    @media (max-width: 340px) {
        .rates-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
    .rate-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .rate-val { font-size: 0.9rem; font-weight: 700; color: #fff; }
    .rate-key { font-size: 0.65rem; color: #94a3b8; margin-top: 2px; font-weight: 600; }

    /* --- FORM STYLING --- */
    .input-wrapper { position: relative; z-index: 1; margin-bottom: 14px; }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 0.9rem;
      transition: color 0.3s;
      z-index: 2;
    }

    .form-input {
      width: 100%;
      padding: 14px 14px 14px 40px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Autofill Fix */
    .form-input:-webkit-autofill,
    .form-input:-webkit-autofill:hover,
    .form-input:-webkit-autofill:focus,
    .form-input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
        -webkit-text-fill-color: white !important;
        caret-color: white;
        transition: background-color 5000s ease-in-out 0s;
        border-color: rgba(59, 130, 246, 0.3);
    }

    .form-input:focus {
      border-color: #3b82f6;
      background: rgba(15, 23, 42, 0.7);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    }
    .form-input:focus + .input-icon { color: #3b82f6; }
    .form-input::placeholder { color: rgba(148, 163, 184, 0.5); }

    /* --- BUTTONS --- */
    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: var(--primary-gradient);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 6px;
      z-index: 1;
      box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
    }

    .submit-btn::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.6);
    }
    .submit-btn:hover::after { opacity: 1; }
    .submit-btn:active { transform: translateY(0); }

    .submit-btn.loading {
      background: #334155;
      color: #94a3b8;
      cursor: wait;
      box-shadow: none;
    }

    /* --- FOOTER --- */
    .auth-switch {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }
    .switch-link {
      color: #60a5fa;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      margin-left: 5px;
      transition: color 0.2s;
    }
    .switch-link:hover { color: #93c5fd; text-decoration: underline; }

    /* --- EXTERNAL NOTICE --- */
    .notice-text {
      margin-top: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.8;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    /* --- UTILS --- */
    .hidden { display: none; }
    .row { display: flex; gap: 10px; }
    .col { flex: 1; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="aurora-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-wrapper">
    <div class="glass-card">

      <div class="brand-section">
        <div class="logo-container">
          <img src="assets/logo_images/my-logo.png" alt="Stallz" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div class="welcome-title" id="mainTitle">STALLZ LOANS</div>
        <div class="tagline" id="tagline">Fast. Secure. Low Rates.</div>
        <div class="sub-text" id="subTitle">Sign in to manage your account</div>
      </div>

      <div class="rates-widget">
        <div class="rates-label"><i class="fa-solid fa-chart-line"></i> Live Rates</div>
        <div class="rates-grid">
          <div class="rate-item">
            <div class="rate-val">20%</div>
            <div class="rate-key">Weekly</div>
          </div>
          <div class="rate-item">
            <div class="rate-val">30%</div>
            <div class="rate-key">2 Wks</div>
          </div>
          <div class="rate-item">
            <div class="rate-val">35%</div>
            <div class="rate-key">3 Wks</div>
          </div>
          <div class="rate-item">
            <div class="rate-val" style="color:#4ade80">40%</div>
            <div class="rate-key">Monthly</div>
          </div>
        </div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-wrapper">
          <input type="email" id="loginEmail" class="form-input" placeholder="Email Address" required autocomplete="email">
          <i class="fa-solid fa-envelope input-icon"></i>
        </div>

        <div class="input-wrapper">
          <input type="password" id="loginPass" class="form-input" placeholder="Password" required autocomplete="current-password">
          <i class="fa-solid fa-lock input-icon"></i>
        </div>

        <button type="submit" id="loginBtn" class="submit-btn">
          Sign In
        </button>

        <div class="auth-switch">
          New here? <span class="switch-link" onclick="switchMode('register')">Create Account</span>
        </div>
      </form>

      <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">

        <div class="row">
          <div class="col input-wrapper">
            <input type="text" id="regName" class="form-input" placeholder="First Name" required autocomplete="given-name">
            <i class="fa-solid fa-user input-icon"></i>
          </div>
          <div class="col input-wrapper">
            <input type="text" id="regSurname" class="form-input" placeholder="Surname" required autocomplete="family-name">
          </div>
        </div>

        <div class="input-wrapper">
          <input type="email" id="regEmail" class="form-input" placeholder="Email Address" required autocomplete="email">
          <i class="fa-solid fa-envelope input-icon"></i>
        </div>

        <div class="input-wrapper">
          <input type="tel" id="regPhone" class="form-input" placeholder="Phone (e.g. 097...)" required autocomplete="tel">
          <i class="fa-solid fa-phone input-icon"></i>
        </div>

        <div class="row">
          <div class="col input-wrapper">
            <input type="text" id="regNrc" class="form-input" placeholder="NRC #" required>
            <i class="fa-solid fa-id-card input-icon"></i>
          </div>
          <div class="col input-wrapper">
            <input type="text" id="regAddress" class="form-input" placeholder="City" required autocomplete="address-level2">
          </div>
        </div>

        <div class="input-wrapper">
          <input type="password" id="regPass" class="form-input" placeholder="Create Password" required autocomplete="new-password">
          <i class="fa-solid fa-key input-icon"></i>
        </div>

        <button type="submit" id="regBtn" class="submit-btn">
          Create Account
        </button>

        <div class="auth-switch">
          Already a member? <span class="switch-link" onclick="switchMode('login')">Sign In</span>
        </div>
      </form>

    </div>

    <div class="notice-text">Strictly Collateral Based Loans</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="shared/firebase-init.js"></script>
  <script src="shared/auth.js"></script>

  <script>
    /* --- UI LOGIC --- */

    function switchMode(mode) {
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('registerForm');
      const mainTitle = document.getElementById('mainTitle');
      const tagline = document.getElementById('tagline');
      const subTitle = document.getElementById('subTitle');

      // Clear inputs for security/ux
      document.querySelectorAll('input').forEach(i => i.value = '');

      // Smooth Fade Transition
      if (mode === 'register') {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');

        mainTitle.textContent = "JOINA STALLZ";
        tagline.style.display = 'none';
        subTitle.textContent = "Create your secure account";
      } else {
        regForm.classList.add('hidden');
        loginForm.classList.remove('hidden');

        mainTitle.textContent = "Stallz Loans";
        tagline.style.display = 'block';
        subTitle.textContent = "Sign in to manage your account";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;

      setLoading(btn, true, "Verifying...");

      try {
        const res = await window.StallzAuth.signIn(email, pass);
        // Short delay for visual feedback
        setTimeout(() => {
          if (res.role === 'admin') window.location.href = 'admin/admin.html';
          else window.location.href = 'client-portal/client.html';
        }, 800);
      } catch (err) {
        alert("Login Failed: " + err.message);
        setLoading(btn, false, "Sign In");
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      const data = {
        firstName: document.getElementById('regName').value,
        surname: document.getElementById('regSurname').value,
        email: document.getElementById('regEmail').value,
        phone: document.getElementById('regPhone').value,
        nrc: document.getElementById('regNrc').value,
        address: document.getElementById('regAddress').value,
        password: document.getElementById('regPass').value
      };

      setLoading(btn, true, "Creating Account...");

      try {
        await window.StallzAuth.registerClient(data);
        alert("Account Created! Redirecting...");
        window.location.href = 'client-portal/client.html';
      } catch (err) {
        alert("Error: " + err.message);
        setLoading(btn, false, "Create Account");
      }
    }

    function setLoading(btn, isLoading, text) {
      if (isLoading) {
        btn.innerHTML = `<span class="spinner"></span> ${text}`;
        btn.classList.add('loading');
        btn.disabled = true;
      } else {
        btn.innerHTML = text;
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
