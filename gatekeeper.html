<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stallz Loans — Securing Session</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

  <style>
    :root {
      --primary: #16a34a;
      --accent-glow: #86efac;
      --text-main: #0f172a;
      --text-muted: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      color: var(--text-main);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      position: relative;
      background-color: #0f172a; /* Fallback dark background */
    }

    /* --- PARALLAX BREATHING BACKGROUND --- */
    .bg-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      /* Updated to local background image */
      background: url('assets/images/background.jpg') no-repeat center center fixed;
      background-size: cover;
      z-index: -2;
      animation: breath 20s infinite alternate ease-in-out;
    }

    @keyframes breath {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* Protective Dark/Green Overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.45) 0%, rgba(22, 163, 74, 0.25) 100%);
      z-index: -1;
    }

    /* --- 3D ULTRA-CLEAR GLASS CARD --- */
    .glass-container {
      width: 100%;
      max-width: 380px;
      padding: 50px 30px;
      border-radius: 36px;
      margin-top: -12vh;

      /* Lowered opacity and blur for clearer glass */
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(22, 163, 74, 0.02) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);

      /* Refined Shadows */
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        0 25px 50px -12px rgba(0, 0, 0, 0.3),
        0 10px 30px rgba(22, 163, 74, 0.2);

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;

      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* --- FROSTED CIRCULAR LOGO RING --- */
    .logo-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;

      /* Glass effect for the ring itself */
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);

      padding: 12px;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: pulseGlow 2s infinite alternate ease-in-out;
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
    }

    /* Subdued animation to match the login screen */
    @keyframes pulseGlow {
      0% {
        transform: scale(1) translateY(0);
        box-shadow: 0 4px 8px rgba(22, 163, 74, 0.1), inset 0 0 10px rgba(255, 255, 255, 0.3);
      }
      100% {
        transform: scale(1.04) translateY(-4px);
        box-shadow: 0 6px 12px rgba(22, 163, 74, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.5);
      }
    }

    /* --- TYPOGRAPHY --- */
    .splash-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .loader-status {
      color: var(--accent-glow);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      margin-top: 15px;
      margin-bottom: 25px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      min-height: 16px;
    }

    /* --- SHIMMERING COMET LOADING BAR --- */
    .progress-track {
      width: 100%;
      height: 10px;
      background: rgba(15, 23, 42, 0.3);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 12px;
      background: linear-gradient(90deg, #16a34a, #4ade80, #86efac, #16a34a);
      background-size: 200% 100%;
      box-shadow: 0 0 15px rgba(22, 163, 74, 0.4);
      transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      animation: shimmerBar 1.5s infinite linear;
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 15px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9));
      border-radius: 50%;
      box-shadow: 2px 0 8px rgba(255,255,255,0.8);
    }

    @keyframes shimmerBar {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* --- HANG RETRY BUTTON --- */
    .retry-btn {
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 50px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
      display: none;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.1);
    }

    .retry-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* --- MOBILE RESPONSIVENESS (ZOOM OUT EFFECT) --- */
    @media (max-width: 480px) {
      .glass-container {
        width: 88%;
        padding: 40px 20px;
      }
      .logo-ring {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
        padding: 8px;
      }
      .splash-title { font-size: 1.35rem; }
      .loader-status { font-size: 0.65rem; margin-top: 10px; margin-bottom: 20px; }
      .progress-track { height: 8px; }
    }
  </style>
</head>
<body>

  <div class="bg-layer"></div>

  <div class="glass-container" id="glassBox">
    <div class="logo-ring">
      <img src="assets/logo_images/my-logo.png" alt="Stallz Logo" onerror="this.style.display='none'">
    </div>

    <div class="splash-title">STALLZ LOANS</div>
    <div id="loaderStatus" class="loader-status">Securing Session...</div>

    <div class="progress-track">
      <div id="splashProgress" class="progress-bar"></div>
    </div>

    <button id="retryBtn" class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="shared/app-config.js"></script>
  <script src="shared/firebase-init.js"></script>

  <script>
  function smoothNav(url){
    try{
      document.body.classList.add("stallz-fadeout");
    }catch(_){ }
    setTimeout(()=>{ window.location.replace(url); }, 220);
  }

    const bar = document.getElementById('splashProgress');
    const statusText = document.getElementById('loaderStatus');
    const retryBtn = document.getElementById('retryBtn');
    let progress = 0;

    // 1. Session TTL Enforcement Validator
    function isSessionValid() {
      try {
        const sessRaw = localStorage.getItem("stallz_test_session");
        if (!sessRaw) return true;
        const sess = JSON.parse(sessRaw);
        if (sess && sess.expiresAt && Date.now() > sess.expiresAt) {
          localStorage.removeItem("stallz_test_session");
          return false;
        }
        return true;
      } catch(e) { return true; }
    }

    // Dynamic Progress Advance
    function advanceProgress(target, status, callback) {
      const interval = setInterval(() => {
        if (progress >= target) {
          clearInterval(interval);
          if (callback) callback();
        } else {
          progress += 1;
          bar.style.width = progress + '%';
          statusText.innerHTML = status;
        }
      }, 15);
    }

    // Direct Cut to App
    function executeRouting(finalRole) {
      if ('vibrate' in navigator) navigator.vibrate([30, 50, 30]);
      smoothNav(finalRole === 'admin' ? 'admin/admin.html' : 'client-portal/client.html');
    }

    // Build Personalized Greeting (Using Time-Based System)
    function getPersonalizedGreeting() {
      const nm = localStorage.getItem('stallz_offline_name') || '';
      const firstName = nm.split(' ')[0].replace(/[^a-zA-Z]/g, '');
      const hour = new Date().getHours();
      let greeting = "Good Evening";
      if (hour < 12) greeting = "Good Morning";
      else if (hour < 18) greeting = "Good Afternoon";

      return firstName ? `${greeting}, ${firstName}` : greeting;
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Step 1: TTL Check
      if (!isSessionValid()) {
        if (typeof firebase !== 'undefined' && firebase.auth) firebase.auth().signOut();
        smoothNav('index.html');
        return;
      }

      advanceProgress(35, "Verifying Identity...", () => {

        // Step 2: Smart Offline Bypass
        if (!navigator.onLine) {
            advanceProgress(100, `<span style="color: var(--accent-glow)">Offline Mode Active</span>`, () => {
                const cachedRole = localStorage.getItem('stallz_offline_role') || 'client';
                setTimeout(() => executeRouting(cachedRole), 200); // Quick delay to see 100% text
            });
            return;
        }

        let authResolved = false;

        // Step 3: Hang Timer & Auto-Retry UI
        const hangTimer = setTimeout(() => {
            if (!authResolved) {
                statusText.innerHTML = "<span style='color:#fca5a5; font-weight:bold;'>Connection Timeout.</span>";
                retryBtn.style.display = 'inline-block';
                if ('vibrate' in navigator) navigator.vibrate([50, 30, 50]);
            }
        }, 5000);

        try {
            if (typeof firebase === 'undefined' || typeof firebase.auth !== 'function') {
                throw new Error("Firebase not initialized.");
            }

            firebase.auth().onAuthStateChanged((user) => {
              authResolved = true;
              clearTimeout(hangTimer);

              if (user) {
                advanceProgress(80, "Securing Network...", () => {
                  (async () => {
                    try {
                      const uid = user.uid;
                      let role = (localStorage.getItem('stallz_offline_role') || 'client').toLowerCase();

                      // Step 4: Parallel Database Queries (Massive Speed Boost)
                      const p1 = firebase.database().ref(`roles/${uid}`).get().catch(()=>null);
                      const p2 = firebase.database().ref(`admins/${uid}`).get().catch(()=>null);

                      const [roleSnap, adminSnap] = await Promise.all([p1, p2]);

                      if (roleSnap && roleSnap.exists()) {
                          role = String(roleSnap.val() || '').toLowerCase() || role;
                      }

                      if (adminSnap && adminSnap.exists()) {
                          role = 'admin';
                          const av = adminSnap.val() || {};
                          const nm = (av.name || ((av.firstname || '') + ' ' + (av.surname || ''))).trim();
                          if (nm) localStorage.setItem('stallz_offline_name', nm);
                      }

                      localStorage.setItem('stallz_offline_role', role === 'admin' ? 'admin' : role);
                      const finalRole = localStorage.getItem('stallz_offline_role') || 'client';

                      // Step 5: Personalized Completion & Instant Cut
                      advanceProgress(100, getPersonalizedGreeting(), () => {
                        setTimeout(() => executeRouting(finalRole), 200); // 200ms just to ensure they read the greeting
                      });

                    } catch (err) {
                        statusText.innerHTML = "<span style='color:#fca5a5'>Profile Sync Error.</span>";
                        retryBtn.style.display = 'inline-block';
                        if ('vibrate' in navigator) navigator.vibrate([50, 30, 50]);
                    }
                  })();
                });
              } else {
                smoothNav('index.html');
              }
            });
        } catch (error) {
            clearTimeout(hangTimer);
            statusText.innerHTML = "<span style='color:#fca5a5; font-weight:bold;'>System Error.</span>";
            retryBtn.style.display = 'inline-block';
            if ('vibrate' in navigator) navigator.vibrate([50, 30, 50]);
        }
      });
    });
  </script>
</body>
</html>
